stages:
  - test

unit-test:
  stage: test
  image: node:24-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends make python3 python3-pip python3-venv
    - python3 -m venv .venv
    - .venv/bin/python -m pip install --upgrade pip
    - .venv/bin/python -m pip install -e ".[dev]"
    - npm --prefix web ci
  script:
    - make test-unit
