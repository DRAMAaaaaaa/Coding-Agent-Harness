services:
  harness:
    build:
      context: .
    image: coding-agent-harness:mvp
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HARNESS_LLM_PROVIDER: mock
    volumes:
      - "./examples/python_demo:/workspace/project:ro"
      - "harness-state:/state"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s

volumes:
  harness-state:
